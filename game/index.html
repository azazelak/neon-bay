<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — an open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0a12; font-family: Arial, Helvetica, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #topbar { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; gap: 18px; align-items: center;
    font-size: 17px; font-weight: bold; text-shadow: 0 2px 4px #000; }
  #cash { color: #7dff5a; font-size: 22px; }
  #stars { font-size: 24px; letter-spacing: 2px; margin-left: auto; }
  #objective { position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
    background: rgba(8, 10, 16, 0.72); padding: 8px 18px; border-radius: 6px; font-size: 16px;
    border-left: 4px solid #ff2e88; max-width: 70vw; text-align: center; }
  #speed { position: absolute; right: 18px; bottom: 16px; font-size: 26px; font-weight: bold; text-shadow: 0 2px 4px #000; }
  #weapon { position: absolute; right: 18px; bottom: 52px; font-size: 13px; opacity: 0.9; text-shadow: 0 2px 4px #000; }
  #minimap { position: absolute; left: 14px; bottom: 14px; width: 180px; height: 180px;
    border: 2px solid rgba(255,255,255,0.35); border-radius: 6px; background: rgba(8,10,16,0.6); }
  #toasts { position: absolute; top: 100px; right: 16px; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: rgba(8, 10, 16, 0.82); border-left: 4px solid #22e6ff; padding: 8px 12px;
    border-radius: 5px; font-size: 14px; max-width: 280px; }
  .toast b { display: block; color: #22e6ff; }
  .toast span { opacity: 0.85; }
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(20,8,32,0.82), rgba(8,4,18,0.92)); color: #fff; z-index: 10; text-align: center; }
  #screen-title { font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #ff2e88;
    text-shadow: 0 0 30px #ff2e88, 0 0 60px #7a2eff; margin: 0; }
  #screen-sub { font-size: 18px; max-width: 560px; opacity: 0.9; margin: 18px 0 8px; }
  .hint { font-size: 15px; color: #ffd23e; margin-top: 22px; }
  .keys { font-size: 13px; opacity: 0.7; margin-top: 26px; line-height: 1.8; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="topbar">
    <span id="cash">$0</span>
    <span id="rep">REP 0</span>
    <span id="clock">17:00</span>
    <span id="tokens">◆ 0/20 TOKENS</span>
    <span id="stars">☆☆☆☆☆</span>
  </div>
  <div id="objective">Press N to start the next job</div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="toasts"></div>
  <div id="weapon"></div>
  <div id="speed"></div>
</div>
<div id="screen">
  <h1 id="screen-title">NEON BAY</h1>
  <p id="screen-sub"></p>
  <p class="hint">Click to start</p>
  <p class="keys">WASD — move / drive &nbsp;·&nbsp; Mouse drag — look &nbsp;·&nbsp; Click — shoot<br>
  E — steal / exit car &nbsp;·&nbsp; N — next job &nbsp;·&nbsp; R — reload &nbsp;·&nbsp; F — punch &nbsp;·&nbsp; Space — brake &nbsp;·&nbsp; Esc — pause</p>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
